<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prometheus Agent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('home-bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      box-sizing: border-box;
    }

    header {
        text-align: center;
      width: 100%;
      max-width: 315px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 0.75rem 1.25rem;
      border-radius: 0.75rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 1.75rem;
      white-space: nowrap;
    }

    .chat-container {
      width: 100%;
      max-width: 860px;
      min-width: 600px;
      height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(10px);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }

    .chat-log {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 1rem;
    }

    .message {
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      margin-bottom: 0.75rem;
      max-width: 90%;
      word-wrap: break-word;
      line-height: 1.4;
      font-size: 1rem;
      background: #1a1a1a;
      color: #eee;
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #2c2c2c, #3a3a3a);
      color: #fff;
    }

    .message.bot {
      align-self: flex-start;
      background: linear-gradient(135deg, #101010, #1a1a1a);
      color: #b2f5ea;
    }

    .chat-input-box {
      display: flex;
      background: #fff;
      border-radius: 2rem;
      padding: 0.5rem 1rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .chat-input-box input {
      border: none;
      outline: none;
      flex: 1;
      font-size: 1rem;
      background: transparent;
    }

    .chat-input-box button {
      border: none;
      background: none;
      font-size: 1.5rem;
      color: #333;
      padding-left: 0.5rem;
    }

    @media (max-width: 767px) {
      header, .chat-container {
        max-width: 100%;
        min-width: auto;
      }

      header h1 {
        font-size: 1.25rem;
        white-space: normal;
        text-align: center;
      }

      .chat-container {
        height: 85vh;
        padding: 1rem;
      }

      .message {
        font-size: 0.95rem;
        padding: 0.6rem 0.9rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Prometheus Agent</h1>
  </header>

  <div class="chat-container">
    <div id="chatLog" class="chat-log"></div>

    <div class="chat-input-box">
      <input type="text" id="chatInput" placeholder="Send a message..." />
      <button onclick="handleSubmit()">➤</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('chatInput');
    const chatLog = document.getElementById('chatLog');

    input.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') handleSubmit();
    });

    function handleSubmit() {
      const message = input.value.trim();
      if (!message) return;

      appendMessage(message, 'user');
      input.value = '';

      setTimeout(() => {
        const botText = `This is a simulated response to: "${message}"\n\nLorem ipsum dolor sit amet.`;
        typeBotMessage(botText);
      }, 500);
    }

    function appendMessage(text, type) {
      const msg = document.createElement('div');
      msg.className = `message ${type}`;
      msg.innerText = text;
      chatLog.appendChild(msg);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function typeBotMessage(text) {
      const msg = document.createElement('div');
      msg.className = 'message bot';
      chatLog.appendChild(msg);

      let i = 0;
      const interval = setInterval(() => {
        msg.innerText = text.slice(0, i++);
        chatLog.scrollTop = chatLog.scrollHeight;
        if (i > text.length) clearInterval(interval);
      }, 20);
    }
  </script>
</body>
</html>
